# ACME (HTTP-01) endpoint for the event-center certificate.
#
# This block must stay: certbot renews over plain HTTP on port 80, and the
# renewal config points at the webroot below.
#
# __TLS_HOST__ is substituted by setup-nginx.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __TLS_HOST__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
