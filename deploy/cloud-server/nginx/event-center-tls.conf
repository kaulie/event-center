# Public HTTPS entry point for event-center.
#
# __TLS_HOST__ is substituted by setup-nginx.sh. The application itself listens
# on 127.0.0.1:9099 only, so this file is the whole public surface.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __TLS_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__TLS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__TLS_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # The application caps bodies at 5 MiB and answers 413 itself.
    client_max_body_size 6m;

    # --- GitHub ingestion -------------------------------------------------
    # The network is the second lock: the HMAC secret is weak by decision, so
    # only GitHub's published hook ranges may reach this path. Everything else
    # gets 403 before it can be interpreted as an event.
    location = /github-events-ingress {
        allow 140.82.112.0/20;
        allow 143.55.64.0/20;
        allow 192.30.252.0/22;
        allow 185.199.108.0/22;
        allow 2a0a:a440::/29;
        allow 2606:50c0::/32;
        allow 127.0.0.1;   # ops/testing from the host itself
        deny all;

        proxy_pass http://127.0.0.1:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Metrics: operational data, not for the public ---------------------
    # The application serves /metrics unauthenticated by design (it is meant
    # for a local scraper), so the restriction lives here.
    location = /metrics {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://127.0.0.1:9099;
        proxy_set_header Host $host;
    }

    # --- Everything else ---------------------------------------------------
    # Admin and consumption endpoints authenticate in the application (admin
    # token or subscription API key). The real client IP is forwarded so the
    # ingress audit trail records who actually called.
    location / {
        proxy_pass http://127.0.0.1:9099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The pull API long-polls up to 30s; must exceed that.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
